<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0F12">
  <meta name="robots" content="noindex, nofollow">
  <title>PING BRO Invoice</title>
  <link rel="icon" href="assets/logo-dark.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- LOGIN -->
  <main id="login" class="login hidden">
    <div class="login-card">
      <img class="login-logo" src="assets/logo-dark.png" alt="PING BRO Konveksi &amp; Sablon">
      <h1>PING BRO Invoice</h1>
      <p class="muted">Aplikasi pembuat invoice internal. Masuk dengan akun Google Owner untuk melanjutkan.</p>
      <div id="gsi-btn" class="gsi-btn"></div>
      <div id="login-msg" class="login-msg" role="alert"></div>
      <div class="login-foot">Hanya akun yang terdaftar sebagai Owner yang dapat masuk.</div>
    </div>
  </main>

  <!-- APLIKASI -->
  <div id="app" class="app hidden">
    <aside class="side" id="side">
      <div class="side-brand"><img src="assets/logo-dark.png" alt="PING BRO"><span>INVOICE</span></div>
      <nav class="side-nav" id="nav-desktop"></nav>
      <div class="side-user">
        <div class="avatar" id="user-av">P</div>
        <div class="who"><div id="user-email" class="email">-</div><div class="role">Owner</div></div>
        <button class="icon-btn" id="btn-logout" title="Keluar" aria-label="Keluar"></button>
      </div>
    </aside>
    <header class="topbar">
      <img src="assets/logo-dark.png" alt="PING BRO">
      <button class="icon-btn" id="btn-logout-m" title="Keluar" aria-label="Keluar"></button>
    </header>
    <main class="main" id="view" tabindex="-1"></main>
    <nav class="tabbar" id="nav-mobile"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/vendor/html-to-image.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sheet.js"></script>
  <script src="js/view-dashboard.js"></script>
  <script src="js/view-editor.js"></script>
  <script src="js/view-history.js"></script>
  <script src="js/view-customers.js"></script>
  <script src="js/notif-ui.js"></script>
  <script src="js/view-settings.js"></script>
  <script src="js/app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.PB && PB.gsiReady && PB.gsiReady()"></script>
</body>
</html>
